<!DOCTYPE html>
<html>
<head>
  <title>Weather API App</title>
</head>

<body>
  <h2>🌤 Weather App (Frontend + Backend API)</h2>

  <input id="city" placeholder="Enter city name" />
  <button onclick="getWeather()">Get Weather</button>

  <h3 id="output"></h3>

  <script>
    async function getWeather() {
      const city = document.getElementById("city").value;

      // FRONTEND → BACKEND CALL
      const res = await fetch(`/weather?city=${city}`);
      const data = await res.json();

      document.getElementById("output").innerHTML =
        `City: ${data.city} <br>
         Temperature: ${data.weather.temperature}°C <br>
         Wind Speed: ${data.weather.windspeed}`;
    }
  </script>
</body>
</html>
